<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- Google Ads — tag musi być w statycznym HTML, nie w Helmecie,
       bo Helmet działa po hydracjach, a consent musi być ustawiony
       zanim załaduje się jakikolwiek skrypt reklamowy. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18028227969"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    // Consent domyślnie granted — naprawia blokadę banera cookie.
    // Jeśli kiedykolwiek dodasz CMP (Cookiebot, CookieYes itp.),
    // zmień te wartości na 'denied' i aktualizuj je po wyborze użytkownika.
    gtag('consent', 'default', {
      ad_storage:        'granted',
      ad_user_data:      'granted',
      ad_personalization:'granted',
      analytics_storage: 'granted'
    });
    gtag('set', 'url_passthrough', true);
    gtag('js', new Date());
    gtag('config', 'AW-18028227969');

    // USUNIĘTO: gtag_report_conversion()
    // Jedyne miejsce odpalające konwersje to teraz fireConversion() w src/seo/site.js.
    // Każde dodatkowe wywołanie to potencjalne podwójne zliczenie.
  </script>

  <!-- Viewport — MUSI być tu, nie w Helmecie.
       Wstrzyknięty przez Helmet działa dopiero po hydracji → brak
       responsywności przy pierwszym renderze → CLS → niższy Quality Score. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="theme-color" content="#e74c3c" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Placeholder — Helmet nadpisze to per-route po renderze.
       NIE wstawiaj tu docelowych meta, canonical ani JSON-LD —
       byłyby widoczne na każdej podstronie jako strona główna. -->
  <title>Bezpieczny Dach</title>
  <meta name="description" content="Dekarz Szczecin — dachy płaskie i papa termozgrzewalna." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- USUNIĘTO: <link rel="canonical"> — każda strona deklaruje swój canonical przez Helmet -->
  <!-- USUNIĘTO: JSON-LD — każda strona ma swoje schematy przez Helmet z site.js -->
  <!-- USUNIĘTO: OG tagi — każda strona deklaruje je przez Helmet -->
</head>

<body>
  <noscript>
    Strona wymaga obsługi JavaScript. Włącz JavaScript w ustawieniach przeglądarki.
  </noscript>
  <div id="root"></div>
</body>
</html>
